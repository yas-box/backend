name: release

on:
  push:
    branches: [main]

permissions:
  contents: write   # 태그·릴리스 생성
  packages: write   # ghcr 푸시
  issues: write     # 실패 시 이슈 생성

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # semantic-release가 전체 커밋 이력을 봐야 한다

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ghcr 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 릴리스 도구 설치
        run: npm ci || npm install

      - name: semantic-release 실행
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: dispatch용 App 토큰 발급
        if: steps.semrel.outputs.released == 'true'
        id: apptoken
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DISPATCH_APP_ID }}
          private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}
          owner: yas-box
          repositories: docs

      - name: docs 저장소 깨우기
        if: steps.semrel.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          gh api repos/yas-box/docs/dispatches \
            -f event_type=backend-released \
            -F "client_payload[version]=${{ steps.semrel.outputs.version }}"

      - name: 실패 시 이슈 생성
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "릴리스 실패: ${{ github.sha }}" \
            --body "워크플로 실행: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
