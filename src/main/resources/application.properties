# OAS를 빌드 시점에 파일로 떨군다. 릴리스 워크플로가 이 파일을 아티팩트로 첨부한다.
quarkus.smallrye-openapi.store-schema-directory=build/openapi
quarkus.smallrye-openapi.info-title=yas-box API
quarkus.smallrye-openapi.info-version=0.0.0-dev
# 명세는 API 소비자(사람과 에이전트)가 보는 계약이다. 제목과 버전만으로는
# 이 API가 무엇인지 알 수 없다.
quarkus.smallrye-openapi.info-description=코드에서 생성되어 문서 사이트로 자동 배포되는 API. \
  명세가 진실이며 문서는 그 결과물이다.

# 컨테이너 이미지. 태그와 푸시 여부는 워크플로에서 -D로 덮어쓴다.
quarkus.container-image.registry=ghcr.io
quarkus.container-image.group=yas-box
quarkus.container-image.name=backend
quarkus.container-image.push=false
